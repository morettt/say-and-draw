<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SayAndDraw · 说画</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #202124; background: #f4f5f7; }
    body { max-width: 820px; margin: 24px auto; padding: 0 16px; }
    main { background: white; border-radius: 16px; padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 18px; color: #5b606a; }
    #chat { height: 260px; overflow: auto; border: 1px solid #e1e4e8; border-radius: 10px; padding: 12px; }
    .message { padding: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message + .message { border-top: 1px solid #f0f1f2; }
    .name { font-weight: 650; margin-right: 8px; }
    form { display: flex; gap: 8px; margin: 12px 0; }
    input { flex: 1; min-width: 0; padding: 12px; font: inherit; border: 1px solid #c8cdd4; border-radius: 8px; }
    button { padding: 0 20px; font: inherit; background: #202124; color: white; border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { min-height: 24px; color: #5b606a; }
    svg { display: block; width: min(100%, 400px); aspect-ratio: 1; border: 1px solid #e1e4e8; background: white; border-radius: 8px; }
    #tokens { font-size: 12px; color: #626873; overflow-wrap: anywhere; margin-top: 10px; }
  </style>
</head>
<body>
<main>
  <h1>SayAndDraw · 说画</h1>
  <p>输入文字，让模型聊天或逐笔写数字。当前模型支持单个数字 0～9。</p>
  <div id="chat" aria-live="polite"></div>
  <form id="form">
    <input id="prompt" value="请你画一个数字3" aria-label="输入消息" autocomplete="off">
    <button id="send" type="submit">生成</button>
  </form>
  <div id="status" aria-live="polite"></div>
  <svg id="canvas" viewBox="0 0 400 400" role="img" aria-label="模型绘制的笔画"></svg>
  <div id="tokens"></div>
</main>
<script>
  const history = [];
  const chat = document.getElementById('chat');
  const promptInput = document.getElementById('prompt');
  const button = document.getElementById('send');
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  const tokens = document.getElementById('tokens');
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  function addMessage(name, content) {
    const item = document.createElement('div');
    item.className = 'message';
    const label = document.createElement('span');
    label.className = 'name';
    label.textContent = `${name}：`;
    item.append(label, document.createTextNode(content));
    chat.append(item);
    chat.scrollTop = chat.scrollHeight;
  }

  async function draw(strokes) {
    canvas.replaceChildren();
    for (const stroke of strokes) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', '#202124');
      line.setAttribute('stroke-width', '4');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('stroke-linejoin', 'round');
      canvas.append(line);
      const points = [];
      for (const point of stroke) {
        points.push(`${(point[0] * 300 + 50).toFixed(1)},${(point[1] * 300 + 50).toFixed(1)}`);
        line.setAttribute('points', points.join(' '));
        await sleep(10);
      }
    }
  }

  document.getElementById('form').addEventListener('submit', async event => {
    event.preventDefault();
    const content = promptInput.value.trim();
    if (!content || button.disabled) return;
    promptInput.value = '';
    addMessage('你', content);
    history.push({ role: 'user', content });
    button.disabled = true;
    status.textContent = '正在生成…';
    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history.slice(-16) })
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '请求失败');
      addMessage('模型', result.reply || (result.strokes ? '已绘制。' : '（空回复）'));
      history.push({ role: 'assistant', content: result.reply || '' });
      if (result.strokes) {
        tokens.textContent = result.tokens.join(' ');
        await draw(result.strokes);
      }
      status.textContent = `生成耗时 ${result.elapsed_ms} 毫秒`;
    } catch (error) {
      history.pop();
      addMessage('系统', `错误：${error.message}`);
      status.textContent = '生成失败';
    } finally {
      button.disabled = false;
      promptInput.focus();
    }
  });
</script>
</body>
</html>
