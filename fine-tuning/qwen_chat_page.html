<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qwen 对话与手写</title>
<style>body{margin:0;background:#f5f6fa;color:#202333;font:16px system-ui}main{max-width:860px;margin:auto;padding:24px}header{border-bottom:1px solid #ddd;padding-bottom:16px}h1{font-size:24px;margin:0 0 8px}.muted{color:#687080;font-size:14px}#messages{min-height:50vh;padding:20px 0}.message{padding:16px;margin:12px 0;background:white;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#e6edff;margin-left:60px}.role{font-size:13px;color:#687080;margin-bottom:8px}textarea{box-sizing:border-box;width:100%;min-height:95px;padding:14px;font:inherit;border:1px solid #bbc1ce;border-radius:12px}button{padding:10px 22px;border:0;border-radius:8px;background:#335eea;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}.controls{display:flex;gap:12px;align-items:center;margin-top:10px}svg{display:block;width:220px;height:220px;max-width:100%;background:#fff;margin-top:10px}#status{color:#687080}#clear{background:#e5e7ed;color:#333}</style>
<main><header><h1>Qwen 对话与手写</h1><div class="muted">当前模型：Qwen3.5 · 多轮优化版</div><p class="muted">可以直接聊天，或请它手写一个数字、大写英文字母。</p></header><div id="messages"><div class="muted">直接输入文字，测试它的回复和手写效果。</div></div><form id="form"><textarea id="input" placeholder="例如：你好，帮我写一个字母 A。" required></textarea><div class="controls"><button id="send">发送</button><button id="clear" type="button">新对话</button><span id="status"></span></div></form></main>
<script>
const messages=document.querySelector('#messages'),input=document.querySelector('#input'),send=document.querySelector('#send'),status=document.querySelector('#status');let history=[];
function bubble(role,text){const box=document.createElement('div');box.className='message '+role;const label=document.createElement('div');label.className='role';label.textContent=role==='user'?'你':'Qwen';box.append(label);const content=document.createElement('div');content.textContent=text;box.append(content);messages.append(box);return box}
function drawing(box,strokes){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 240 240');for(const stroke of strokes){const p=document.createElementNS(ns,'polyline');p.setAttribute('points',stroke.map(([x,y])=>`${20+(.5+(x-.5)*.43)*200},${20+y*200}`).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke','#202333');p.setAttribute('stroke-width','2.5');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');svg.append(p)}box.append(svg)}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;const prior=history.slice();bubble('user',text);input.value='';send.disabled=true;document.querySelector('#clear').disabled=true;status.textContent='模型正在回复…';try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:text,history:prior,temperature:.7})});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'请求失败');const box=bubble('assistant',d.reply||((d.strokes||[]).length?'模型生成了笔迹，没有生成文字回复。':'模型本次未生成可显示的回复。'));if(d.strokes?.length)drawing(box,d.strokes);history.push({role:'user',content:text},{role:'assistant',content:d.history_content||d.reply||''});status.textContent='';}catch(err){bubble('assistant','请求失败：'+err.message);status.textContent='';}finally{send.disabled=false;document.querySelector('#clear').disabled=false;input.focus();window.scrollTo(0,document.body.scrollHeight)}};
document.querySelector('#clear').onclick=()=>{history=[];messages.replaceChildren();input.focus()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!send.disabled)document.querySelector('#form').requestSubmit()}};
</script></html>
